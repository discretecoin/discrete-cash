name: Services contribution checks

on:
  pull_request:
  push:
    branches: [main, '**/services-directory']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Website and actual backend schema contract
        run: node --test tests/*.test.cjs
      - name: Private moderation package tests
        working-directory: integrations/service-moderation
        run: npm test
      - name: Bundle Worker without deployment
        working-directory: integrations/service-moderation
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run
